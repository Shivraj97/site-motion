<!doctype html>
<!-- Synthetic fixture: big red error/danger UI and amber warnings around a small brand-teal call to action. -->
<html lang="en"><head><meta charset="utf-8"><title>Tally — status colours fixture</title>
<style>
  body { margin: 0; padding: 48px; background: #ffffff; color: #0f172a; font-family: Inter, sans-serif; }
  p { font-size: 18px; max-width: 700px; }
  .btn { display: inline-block; padding: 12px 20px; border-radius: 6px; color: #fff; border: 0; font-size: 16px; text-decoration: none; }
  .btn-start { background: #0d9488; }
  .btn-danger { background: #dc2626; padding: 22px 60px; font-size: 22px; }
  .alert-error { background: #dc2626; color: #fff; padding: 40px; margin: 24px 0; width: 900px; font-size: 20px; }
  .text-amber-600 { color: #d97706; font-size: 22px; }
</style></head>
<body>
  <h1>Your invoices</h1>
  <div class="alert-error" role="alert">3 invoices failed to sync. Check your bank connection.</div>
  <p class="text-amber-600">Your trial ends in 2 days. Your trial ends in 2 days. Your trial ends in 2 days.</p>
  <p>Track every invoice from draft to paid without leaving the dashboard.</p>
  <a class="btn btn-start" href="/new">New invoice</a>
  <button class="btn btn-danger">Delete all invoices</button>
</body></html>
